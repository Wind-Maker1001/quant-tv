name: FactorLab minute engineering evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factorlab-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  minute-engineering:
    name: Python 3.9 minute engineering evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      EVIDENCE_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

    steps:
      - name: Check out exact head with the publication base
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "$CHECKOUT_SERVER/$CHECKOUT_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth_header"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$CHECKOUT_SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' "$EVIDENCE_SUBJECT_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$EVIDENCE_SUBJECT_SHA"
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9.25'
          cache: pip
          cache-dependency-path: dev/requirements-research-ci.txt

      - name: Install unchanged isolated dependency pins
        run: |
          python -m pip install -r dev/requirements-research-ci.txt
          python -m pip check

      - name: Check minute engineering static defects
        run: >-
          python -m flake8 qbot/engineering/yhh30m tests/minute_data
          --select E9,F63,F7,F82

      - name: Record exact execution subject and source contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          from qbot.engineering.yhh30m.storage import implementation_sha

          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['EVIDENCE_SUBJECT_SHA']
          contract = Path('docs/research/evidence/yhh30m-independent-20261019-v1/minute-ci-contract.json')
          output = Path('results/diagnostics/ci/minute-engineering')
          output.mkdir(parents=True, exist_ok=True)
          evidence = {
              'subject_sha': sha,
              'controller_sha': os.environ['GITHUB_SHA'],
              'subject_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'python': platform.python_version(),
              'platform': platform.system(),
              'contract_sha256': hashlib.sha256(contract.read_bytes()).hexdigest(),
              'implementation_sha256': implementation_sha(),
              'formal_admission': False,
              'no_live_money': True,
          }
          (output / 'provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Execute every minute and publication regression with coverage
        run: >-
          python -B -m pytest tests/minute_data -q --tb=short
          --cov=qbot.engineering.yhh30m
          --cov-report=xml:results/diagnostics/ci/minute-engineering/coverage.xml
          --junitxml=results/diagnostics/ci/minute-engineering/junit.xml
          --basetemp="$RUNNER_TEMP/minute-engineering-tests"

      - name: Verify exact tests and full source coverage inventory without lost hits
        run: |
          python - <<'PY'
          from collections import Counter
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          output = Path('results/diagnostics/ci/minute-engineering')
          contract_path = Path('docs/research/evidence/yhh30m-independent-20261019-v1/minute-ci-contract.json')
          contract = json.loads(contract_path.read_text())
          evidence = json.loads((output / 'provenance.json').read_text())
          assert evidence['subject_sha'] == os.environ['EVIDENCE_SUBJECT_SHA']
          assert evidence['subject_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert evidence['subject_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert evidence['contract_sha256'] == hashlib.sha256(contract_path.read_bytes()).hexdigest()
          assert evidence['implementation_sha256'] == contract['implementation_sha256']
          source_root = Path('qbot/engineering/yhh30m')
          assert sorted(p.name for p in source_root.glob('*.py')) == sorted(contract['sources'])
          for name, expected in contract['sources'].items():
              assert hashlib.sha256((source_root / name).read_bytes()).hexdigest() == expected['sha256']
          for name, expected in contract['test_sources'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected
          junit = ET.parse(output / 'junit.xml').getroot()
          cases = junit.findall('.//testcase')
          observed = [(row.attrib['classname'], row.attrib['name']) for row in cases]
          assert Counter(observed) == Counter(tuple(row) for row in contract['junit_addresses'])
          assert all(row.find(tag) is None for row in cases for tag in ('failure', 'error', 'skipped'))
          suites = list(junit.iter('testsuite'))
          counts = {key: sum(int(row.get(key, '0')) for row in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          assert counts == {'tests': contract['test_count'], 'failures': 0, 'errors': 0, 'skipped': 0}
          coverage = ET.parse(output / 'coverage.xml').getroot()
          classes = coverage.findall('.//class')
          inventory = {Path(row.attrib['filename']).name: row for row in classes}
          assert len(inventory) == len(classes) and set(inventory) == set(contract['sources'])
          total_valid, total_covered = 0, 0
          for name, row in inventory.items():
              lines = row.findall('./lines/line')
              valid = {int(line.attrib['number']) for line in lines}
              hits = {int(line.attrib['number']) for line in lines if int(line.attrib['hits']) > 0}
              expected = contract['sources'][name]
              assert valid == set(expected['valid_lines'])
              assert set(expected['required_covered_lines_by_platform'][evidence['platform']]) <= hits
              total_valid += len(valid)
              total_covered += len(hits)
          assert int(coverage.attrib['lines-valid']) == total_valid
          assert int(coverage.attrib['lines-covered']) == total_covered
          assert total_valid > 0
          assert abs(float(coverage.attrib['line-rate']) - total_covered / total_valid) < 0.000051
          evidence.update(counts)
          evidence.update({'status': 'PASS', 'coverage_sources': len(inventory),
                           'coverage_valid_lines': int(coverage.attrib['lines-valid']),
                           'coverage_covered_lines': int(coverage.attrib['lines-covered']),
                           'coverage_line_rate': float(coverage.attrib['line-rate']),
                           'required_coverage_hits_preserved': True})
          (output / 'summary.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Check publication safety boundaries independently of the frozen minute contract
        run: >-
          python -B -m pytest tests/market_structure/test_publication_scope_audit.py
          tests/market_structure/test_minute_gate_compatibility.py --noconftest -q --tb=short
          --junitxml=results/diagnostics/ci/minute-engineering/publication-tests.xml
          --basetemp="$RUNNER_TEMP/publication-safety-tests"

      - name: Verify full diff safety, minute ownership and unchanged original gates
        run: |
          python -B -m examples.research.review_yhh30m_release --repo . \
            --base "$PUBLICATION_BASE" \
            > results/diagnostics/ci/minute-engineering/publication.json
          test -z "$(git status --porcelain)"

      - name: Retain actual test, coverage and publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minute-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/diagnostics/ci/minute-engineering/
          retention-days: 90
          if-no-files-found: error
