name: FactorLab research tests

on:
  push:
    paths:
      - "qbot/research/**"
      - "tests/research/**"
      - "configs/research/**"
      - "dev/requirements-research.txt"
      - "pytest.ini"
      - ".github/workflows/research-tests.yml"
  pull_request:
    paths:
      - "qbot/research/**"
      - "tests/research/**"
      - "configs/research/**"
      - "dev/requirements-research.txt"
      - "pytest.ini"
      - ".github/workflows/research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factorlab-research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1-offline:
    name: Python 3.9 offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: dev/requirements-research.txt

      - name: Install isolated research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev/requirements-research.txt

      - name: Verify isolated import
        run: python -c "import qbot.research"

      - name: Run Phase 1 offline tests
        run: python -m pytest -q

      - name: Run configuration and architecture audit smoke check
        run: >-
          python -m qbot.research.cli audit
          --config configs/research/csi500_smoke.yaml
