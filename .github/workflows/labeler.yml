name: Add label automatically

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing PR number in this repository'
        type: number
        required: true

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Read only trusted base or explicitly dispatched configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.base.sha }}
          sparse-checkout: .github/labeler.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply configured labels without executing PR code
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          sync-labels: false
