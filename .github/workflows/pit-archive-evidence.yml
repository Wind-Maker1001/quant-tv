name: FactorLab PIT archive evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factorlab-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  pit-archive-evidence:
    name: Python 3.9 PIT archive evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact PR head in a clean repository
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$EVIDENCE_SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "$CHECKOUT_SERVER/$CHECKOUT_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth_header"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$CHECKOUT_SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags --no-recurse-submodules origin "$EVIDENCE_SUBJECT_SHA" \
            '657486f8ca928c1e66b430f471cfe5ce96a613ab'
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$EVIDENCE_SUBJECT_SHA"
          test "$(git rev-parse HEAD)" = "$EVIDENCE_SUBJECT_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9.25"
          cache: pip
          cache-dependency-path: dev/requirements-evidence-ci.txt

      - name: Install fixed lightweight evidence test dependencies
        run: |
          python -m pip install -r dev/requirements-evidence-ci.txt
          python -m pip check

      - name: Record tested commit and execution scope
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess

          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert sha == os.environ["EVIDENCE_SUBJECT_SHA"]
          output = Path("results/diagnostics/ci/pit-archive")
          output.mkdir(parents=True, exist_ok=True)
          evidence = {
              "subject_sha": sha,
              "controller_sha": os.environ["GITHUB_SHA"],
              "subject_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "python": platform.python_version(),
              "run_url": (f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
                          f'/actions/runs/{os.environ["GITHUB_RUN_ID"]}'),
              "test_file": "tests/evidence/test_pit_archive_verifiers.py",
              "migration_git_objects": "synthetic temporary repositories only",
              "formal_admission": False,
              "no_live_money": True,
          }
          (output / "provenance.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Run independent PIT archive verifier tests
        run: >-
          python -m pytest tests/evidence/test_pit_archive_verifiers.py -q --tb=short
          --junitxml=results/diagnostics/ci/pit-archive/junit.xml
          --basetemp="$RUNNER_TEMP/pit-archive-tests"

      - name: Publish actual JUnit counts and verify checkout isolation
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path("results/diagnostics/ci/pit-archive")
          evidence = json.loads((output / "provenance.json").read_text())
          suites = list(ET.parse(output / "junit.xml").getroot().iter("testsuite"))
          counts = {key: sum(int(s.get(key, "0")) for s in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          counts["passed"] = counts["tests"] - sum(counts[k] for k in ("failures", "errors", "skipped"))
          counts["seconds"] = sum(float(s.get("time", "0")) for s in suites)
          assert counts["tests"] > 0, "No evidence tests executed"
          evidence.update(counts)
          (output / "summary.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(f'PIT archive evidence at `{evidence["subject_sha"]}`\n\n')
              stream.write("| Tests | Passed | Failures | Errors | Skipped | Seconds |\n")
              stream.write("| --- | --- | --- | --- | --- | --- |\n")
              stream.write("| " + " | ".join(str(counts[k]) for k in
                           ("tests", "passed", "failures", "errors", "skipped", "seconds")) + " |\n")
          PY
          test -z "$(git status --porcelain)"

      - name: Save evidence JUnit and exact commit provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-archive-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/diagnostics/ci/pit-archive/
          retention-days: 90
          if-no-files-found: error
