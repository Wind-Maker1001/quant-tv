name: FactorLab static checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'qbot/research/**'
      - 'tests/research/**'
      - 'examples/research/**'
      - '.github/workflows/**'
      - '.github/scripts/ci/**'
      - 'dev/requirements-research*.txt'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'qbot/research/**'
      - 'tests/research/**'
      - 'examples/research/**'
      - '.github/workflows/**'
      - '.github/scripts/ci/**'
      - 'dev/requirements-research*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-static:
    name: Research syntax and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            dev/requirements-research.txt
            dev/requirements-research-ci.txt
      - name: Install shared isolated CI dependencies
        run: python -m pip install -r dev/requirements-research-ci.txt
      - name: Check research syntax, static defects and changed whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/ci/research_checks.py
      - name: Check formatting of maintained CI Python scripts
        run: python -m black --check --diff .github/scripts/ci
      - name: Test CI contract checks
        run: python -m unittest discover -s .github/scripts/ci -p 'test_*.py' -v
