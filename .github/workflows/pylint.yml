name: FactorLab static checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'qbot/research/**'
      - 'tests/research/**'
      - 'examples/research/**'
      - '.github/workflows/**'
      - '.github/scripts/ci/**'
      - 'dev/requirements-research*.txt'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'qbot/research/**'
      - 'tests/research/**'
      - 'examples/research/**'
      - '.github/workflows/**'
      - '.github/scripts/ci/**'
      - 'dev/requirements-research*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-static:
    name: Research syntax and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit and full history with ephemeral credentials
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "$CHECKOUT_SERVER/$CHECKOUT_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth_header"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$CHECKOUT_SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$CHECKOUT_SHA"
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: |
            dev/requirements-research.txt
            dev/requirements-research-ci.txt
      - name: Install shared isolated CI dependencies
        run: python -m pip install -r dev/requirements-research-ci.txt
      - name: Check research syntax, static defects and changed whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python .github/scripts/ci/research_checks.py
      - name: Check formatting of maintained CI Python scripts
        run: python -m black --check --diff .github/scripts/ci
      - name: Test CI contract checks
        run: python -m unittest discover -s .github/scripts/ci -p 'test_*.py' -v
