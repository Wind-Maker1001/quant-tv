name: FactorLab workflow validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factorlab-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit without initializing Legacy submodules
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_SERVER: ${{ github.server_url }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "$CHECKOUT_SERVER/$CHECKOUT_REPOSITORY.git"
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth_header"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$CHECKOUT_SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --detach "$CHECKOUT_SHA"
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --output "$RUNNER_TEMP/actionlint.tar.gz" "$ACTIONLINT_URL"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Check every active workflow and optional CodeQL template
        run: >-
          "$RUNNER_TEMP/actionlint"
          .github/workflows/*.yml
          docs/ci/optional-workflows/codeql-analysis.yml
